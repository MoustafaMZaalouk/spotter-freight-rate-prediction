name: Restore approved missing submission files
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact approved files without modifying existing files
        shell: python
        run: |
          import base64,hashlib,io,pathlib,zipfile
          parts=['.github/restore-part-1.txt', '.github/restore-part-2.txt', '.github/restore-part-3.txt', '.github/restore-part-4.txt']
          data=base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in parts))
          assert hashlib.sha256(data).hexdigest()=="1165b16928927b533ad85a698572bfe0d7d941498fd59d54212a49dd0bbe3175"
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for entry in archive.infolist():
                  path=pathlib.Path(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  content=archive.read(entry.filename)
                  if path.exists():
                      assert path.read_bytes()==content
                  else:
                      path.parent.mkdir(parents=True,exist_ok=True)
                      path.write_bytes(content)
      - name: Commit approved missing assets and remove source parts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/__init__.py outputs/validation_predictions.csv reports/report.pdf reports/december_comparison.png outputs/scorer_results/candidate_december.png
          git rm .github/restore-part-*.txt
          git commit -m 'Restore exact approved assets and remove one-time source parts'
          git push
